spring.application.name=tourny-api

spring.datasource.url=${TOURNY_DB_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
spring.datasource.username=${TOURNY_DB_USER:postgres}
spring.datasource.password=${TOURNY_DB_PASSWORD:postgres}

# The schema still comes from supabase/migrations; a Flyway baseline replaces that at cutover.
spring.flyway.enabled=false

# HS256 signing key for access tokens (at least 32 bytes). Set TOURNY_JWT_SECRET outside local development.
tourny.jwt.secret=${TOURNY_JWT_SECRET:local-development-only-secret-change-me-0123456789}
tourny.jwt.ttl-seconds=3600

# Functions the clients may call through POST /rpc/{function}.
tourny.rpc.allowlist=classpath:rpc-allowlist.txt

management.endpoints.web.exposure.include=health

# Self-hosted PostgREST that serves table/view reads and writes under /rest. For local development this
# is the PostgREST that `supabase start` runs; its JWT secret must equal tourny.jwt.secret.
tourny.postgrest.url=${TOURNY_POSTGREST_URL:http://127.0.0.1:54321/rest/v1}
tourny.postgrest.api-key=${TOURNY_POSTGREST_API_KEY:}

# Origins allowed to call the API from a browser (comma separated).
tourny.cors.origins=${TOURNY_CORS_ORIGINS:http://localhost:3000,http://localhost:3100,http://localhost:3200}

# Uploaded images (avatars, logos). On the VPS point this at a persistent volume that is backed up.
tourny.storage.root=${TOURNY_STORAGE_ROOT:./storage-data}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.enabled=false
