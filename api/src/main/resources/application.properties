spring.application.name=tourny-api

spring.datasource.url=${TOURNY_DB_URL:jdbc:postgresql://127.0.0.1:5440/tourny}
spring.datasource.username=${TOURNY_DB_USER:postgres}
spring.datasource.password=${TOURNY_DB_PASSWORD:postgres}

# The schema comes from db/migrations, applied by deploy/initdb.sh (VPS) or deploy/dev-stack.sh (local).
spring.flyway.enabled=false

# HS256 signing key for access tokens (at least 32 bytes). Required: the API refuses to start without TOURNY_JWT_SECRET,
# so a deployment can never run on a well-known default key.
tourny.jwt.secret=${TOURNY_JWT_SECRET}
tourny.jwt.ttl-seconds=3600

# Functions the clients may call through POST /rpc/{function}.
tourny.rpc.allowlist=classpath:rpc-allowlist.txt

management.endpoints.web.exposure.include=health

# Self-hosted PostgREST that serves table/view reads and writes under /rest. For local development this
# is the PostgREST that deploy/dev-stack.sh runs; its JWT secret must equal tourny.jwt.secret.
tourny.postgrest.url=${TOURNY_POSTGREST_URL:http://127.0.0.1:3001}
tourny.postgrest.api-key=${TOURNY_POSTGREST_API_KEY:}

# Origins allowed to call the API from a browser (comma separated).
tourny.cors.origins=${TOURNY_CORS_ORIGINS:http://localhost:3000,http://localhost:3100,http://localhost:3200}

# Uploaded images (avatars, logos). On the VPS point this at a persistent volume that is backed up.
tourny.storage.root=${TOURNY_STORAGE_ROOT:./storage-data}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.enabled=false

# Password-recovery email. Leave spring.mail.host empty to disable sending (requests are then only logged).
tourny.mail.from=${TOURNY_MAIL_FROM:no-reply@localhost}
spring.mail.host=${TOURNY_SMTP_HOST:}
spring.mail.port=${TOURNY_SMTP_PORT:587}
spring.mail.username=${TOURNY_SMTP_USER:}
spring.mail.password=${TOURNY_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# A missing or unreachable mail server must not make the whole API report DOWN.
management.health.mail.enabled=false

# Behind Caddy the real client address is in X-Forwarded-For.
server.forward-headers-strategy=framework

# Push notifications for the mobile app. The dispatcher sends the push_outbox queue to Expo; an access token is only
# needed if you turn on enhanced push security in your Expo account.
tourny.push.enabled=${TOURNY_PUSH_ENABLED:true}
tourny.push.url=${TOURNY_PUSH_URL:https://exp.host/--/api/v2/push/send}
tourny.push.access-token=${TOURNY_EXPO_ACCESS_TOKEN:}

# Web push (browsers). Generate the key pair with deploy/make-vapid-keys.mjs; the public key also goes to the website as NEXT_PUBLIC_VAPID_PUBLIC_KEY.
tourny.push.vapid.public-key=${TOURNY_VAPID_PUBLIC_KEY:}
tourny.push.vapid.private-key=${TOURNY_VAPID_PRIVATE_KEY:}
tourny.push.vapid.subject=${TOURNY_VAPID_SUBJECT:mailto:admin@localhost}

# Registration fees through each organizer's own Razorpay account. TOURNY_SECRETS_KEY encrypts the stored Razorpay secrets:
# 32 random bytes, base64 (node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"). Without it organizers cannot connect Razorpay.
tourny.secrets.key=${TOURNY_SECRETS_KEY:}
tourny.site-url=${TOURNY_SITE_URL:http://localhost:3000}
tourny.razorpay.base-url=${TOURNY_RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
